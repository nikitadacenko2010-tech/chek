<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканирование баланса TON + Транзакция</title>
    <!-- Официальная библиотека TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
            color: #f8fafc;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        #ton-connect {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .wallet-details {
            display: none;
            margin-top: 1.5rem;
            padding: 1.25rem;
            background-color: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: left;
        }

        .wallet-details.active {
            display: block;
        }

        .info-title {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-family: monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
            word-break: break-all;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            margin-bottom: 1rem;
        }

        .balance-box {
            font-size: 1.25rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .send-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #2563eb;
        }

        .send-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .tx-status {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #94a3b8;
            word-break: break-all;
        }

        .tx-status.success {
            color: #4ade80;
        }

        .tx-status.error {
            color: #f87171;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Сканирование кошелька</h1>
    <p>Подключите Tonkeeper, чтобы проверить адрес, баланс и отправить тестовую транзакцию.</p>

    <div id="ton-connect"></div>

    <div id="wallet-info" class="wallet-details">
        <div class="info-title">Адрес кошелька:</div>
        <div id="wallet-address" class="info-value"></div>

        <div class="info-title">Текущий баланс:</div>
        <div id="wallet-balance" class="info-value balance-box">Загрузка...</div>

        <!-- Кнопка отправки транзакции -->
        <button id="sendTxBtn" class="send-btn" disabled>Отправить 0.01 TON (тест)</button>
        <div id="txStatus" class="tx-status"></div>
    </div>
</div>

<script>
    // Инициализация TON Connect UI
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test-manifest.json',
        buttonRootId: 'ton-connect'
    });

    const walletInfoContainer = document.getElementById('wallet-info');
    const walletAddressContainer = document.getElementById('wallet-address');
    const walletBalanceContainer = document.getElementById('wallet-balance');
    const sendBtn = document.getElementById('sendTxBtn');
    const txStatus = document.getElementById('txStatus');

    // Адрес получателя (замените на свой или оставьте тестовый)
    const RECIPIENT_ADDRESS = 'EQD4FPq-PRDieyQKkizfTR61Lb1fI6bqdV5R8I7T6v0eP0rH'; // тестовый адрес (можете изменить)

    // Функция запроса баланса из блокчейна TON через публичный API TonCenter
    async function fetchWalletBalance(rawAddress) {
        try {
            walletBalanceContainer.innerText = 'Загрузка...';
            const response = await fetch(`https://toncenter.com/api/v2/getAddressInformation?address=${rawAddress}`);
            const data = await response.json();

            if (data.ok && data.result) {
                const balanceInNano = parseInt(data.result.balance, 10);
                const balanceInTon = (balanceInNano / 1e9).toFixed(4);
                walletBalanceContainer.innerText = `${balanceInTon} TON`;
                return balanceInNano; // возвращаем в наноТОНах
            } else {
                walletBalanceContainer.innerText = 'Ошибка получения данных';
                return 0;
            }
        } catch (error) {
            console.error(error);
            walletBalanceContainer.innerText = 'Ошибка сети';
            return 0;
        }
    }

    // Функция отправки транзакции
    async function sendTransaction() {
        const wallet = tonConnectUI.wallet;
        if (!wallet) {
            txStatus.innerText = 'Кошелёк не подключён';
            txStatus.className = 'tx-status error';
            return;
        }

        try {
            sendBtn.disabled = true;
            sendBtn.innerText = 'Отправка...';
            txStatus.innerText = 'Подготовка транзакции...';
            txStatus.className = 'tx-status';

            // Строим транзакцию на 0.01 TON = 10_000_000 наноТОН
            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 300, // 5 минут
                messages: [
                    {
                        address: RECIPIENT_ADDRESS,
                        amount: '10000000', // 0.01 TON в наноТОНах
                        payload: '' // можно оставить пустым
                    }
                ]
            };

            const result = await tonConnectUI.sendTransaction(tx);

            // Если транзакция успешно отправлена (получаем boc или хеш)
            if (result) {
                txStatus.innerText = `✅ Транзакция отправлена! Хеш: ${result.boc || 'успешно'}`;
                txStatus.className = 'tx-status success';
                // Обновляем баланс через пару секунд после отправки
                setTimeout(() => {
                    const address = wallet.account.address;
                    fetchWalletBalance(address);
                }, 3000);
            }
        } catch (error) {
            console.error(error);
            txStatus.innerText = `❌ Ошибка: ${error.message || 'неизвестная ошибка'}`;
            txStatus.className = 'tx-status error';
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerText = 'Отправить 0.01 TON (тест)';
        }
    }

    // Подписка на изменение статуса авторизации кошелька
    tonConnectUI.onStatusChange(async wallet => {
        if (wallet) {
            const address = wallet.account.address;
            walletAddressContainer.innerText = address;
            walletInfoContainer.classList.add('active');

            // Получаем баланс и активируем кнопку отправки
            await fetchWalletBalance(address);
            sendBtn.disabled = false;
            txStatus.innerText = '';
            txStatus.className = 'tx-status';
        } else {
            walletAddressContainer.innerText = '';
            walletBalanceContainer.innerText = 'Загрузка...';
            walletInfoContainer.classList.remove('active');
            sendBtn.disabled = true;
            sendBtn.innerText = 'Отправить 0.01 TON (тест)';
            txStatus.innerText = '';
            txStatus.className = 'tx-status';
        }
    });

    // Назначение обработчика на кнопку отправки
    sendBtn.addEventListener('click', sendTransaction);
</script>

</body>
</html>
